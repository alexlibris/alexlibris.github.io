<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Startpage</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2338bdf8%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22/%3E%3Cline x1=%222%22 y1=%2212%22 x2=%2222%22 y2=%2212%22/%3E%3Cpath d=%22M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z%22/%3E%3C/svg%3E">
  <style>
    :root {
      /* Dark Theme (Podrazumevana tamna tema) */
      --bg-color: #0b0f17;
      --card-bg: #151d2a;
      --card-border: #232f42;
      --card-header-bg: rgba(255, 255, 255, 0.02);
      --card-hover: #1b2637;
      --text-main: #f1f5f9;
      --text-title: #f8fafc;
      --text-link: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --link-hover: #1e293b;
      --link-border: rgba(255, 255, 255, 0.03);
      --search-bg: #131b26;
      --search-border: #2a374d;
      --search-focus-bg: #182232;
      --search-btn-bg: #1e293b;
      --badge-bg: #232f42;
      --badge-color: #94a3b8;
      --favicon-bg: #232f42;
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      --mark-bg: rgba(56, 189, 248, 0.25);
      --mark-color: #38bdf8;
      --theme-toggle-bg: #1e293b;
      --theme-toggle-border: #334155;
      --pin-btn-bg: #151d2a;
      --pin-btn-border: #232f42;
      --pin-btn-hover: #1e293b;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Light Theme (sistemska ili preko dugmeta) */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-color: #f1f5f9;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --card-header-bg: rgba(0, 0, 0, 0.015);
        --card-hover: #f8fafc;
        --text-main: #0f172a;
        --text-title: #0f172a;
        --text-link: #1e293b;
        --text-muted: #64748b;
        --accent-color: #0284c7;
        --link-hover: #f1f5f9;
        --link-border: rgba(0, 0, 0, 0.04);
        --search-bg: #ffffff;
        --search-border: #cbd5e1;
        --search-focus-bg: #ffffff;
        --search-btn-bg: #f1f5f9;
        --badge-bg: #f1f5f9;
        --badge-color: #475569;
        --favicon-bg: #f1f5f9;
        --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        --mark-bg: rgba(2, 132, 199, 0.18);
        --mark-color: #0284c7;
        --theme-toggle-bg: #ffffff;
        --theme-toggle-border: #cbd5e1;
        --pin-btn-bg: #ffffff;
        --pin-btn-border: #e2e8f0;
        --pin-btn-hover: #f1f5f9;
      }
    }

    /* Eksplicitna tema preko data-theme atributa */
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-header-bg: rgba(0, 0, 0, 0.015);
      --card-hover: #f8fafc;
      --text-main: #0f172a;
      --text-title: #0f172a;
      --text-link: #1e293b;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --link-hover: #f1f5f9;
      --link-border: rgba(0, 0, 0, 0.04);
      --search-bg: #ffffff;
      --search-border: #cbd5e1;
      --search-focus-bg: #ffffff;
      --search-btn-bg: #f1f5f9;
      --badge-bg: #f1f5f9;
      --badge-color: #475569;
      --favicon-bg: #f1f5f9;
      --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --mark-bg: rgba(2, 132, 199, 0.18);
      --mark-color: #0284c7;
      --theme-toggle-bg: #ffffff;
      --theme-toggle-border: #cbd5e1;
      --pin-btn-bg: #ffffff;
      --pin-btn-border: #e2e8f0;
      --pin-btn-hover: #f1f5f9;
    }

    [data-theme="dark"] {
      --bg-color: #0b0f17;
      --card-bg: #151d2a;
      --card-border: #232f42;
      --card-header-bg: rgba(255, 255, 255, 0.02);
      --card-hover: #1b2637;
      --text-main: #f1f5f9;
      --text-title: #f8fafc;
      --text-link: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --link-hover: #1e293b;
      --link-border: rgba(255, 255, 255, 0.03);
      --search-bg: #131b26;
      --search-border: #2a374d;
      --search-focus-bg: #182232;
      --search-btn-bg: #1e293b;
      --badge-bg: #232f42;
      --badge-color: #94a3b8;
      --favicon-bg: #232f42;
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      --mark-bg: rgba(56, 189, 248, 0.25);
      --mark-color: #38bdf8;
      --theme-toggle-bg: #1e293b;
      --theme-toggle-border: #334155;
      --pin-btn-bg: #151d2a;
      --pin-btn-border: #232f42;
      --pin-btn-hover: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1rem 2.5rem 1rem;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      width: 100%;
      max-width: 680px;
      margin: 0 auto 1.5rem auto;
    }

    /* Top bar na lock ekranu */
    .lock-top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .icon-btn {
      background: var(--theme-toggle-bg);
      border: 1px solid var(--theme-toggle-border);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--text-title);
      border-color: var(--accent-color);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* PIN Lock Screen */
    #lockScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 75vh;
      text-align: center;
      gap: 1.25rem;
      padding: 1rem;
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      color: var(--accent-color);
      margin-bottom: 0.25rem;
    }

    .lock-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-title);
    }

    .lock-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.4;
    }

    /* Password Form */
    .pwd-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      max-width: 320px;
      margin-top: 0.5rem;
    }

    .pwd-input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .pwd-box {
      width: 100%;
      padding: 0.85rem 2.85rem 0.85rem 1rem;
      font-size: 1.05rem;
      border: 1px solid var(--search-border);
      border-radius: 12px;
      background: var(--search-bg);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      box-shadow: var(--card-shadow);
      -webkit-appearance: none;
    }

    .pwd-box:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2), var(--card-shadow);
      background: var(--search-focus-bg);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.3rem;
    }

    .pwd-toggle-btn svg {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .unlock-btn {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      background: var(--accent-color);
      color: #0b0f17;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .unlock-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .pwd-error {
      color: #ef4444;
      font-size: 0.85rem;
      min-height: 1.2rem;
      font-weight: 500;
    }

    .shake {
      animation: shakeAnim 0.35s ease;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Main Dashboard Content (skriven dok se ne unese PIN) */
    #dashboardContent {
      display: none;
      flex-direction: column;
      width: 100%;
    }

    #dashboardContent.visible {
      display: flex;
    }

    /* Header: Pretraga, lock i light dugmad u jednom redu */
    header {
      width: 100%;
      margin-bottom: 1.25rem;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }

    /* Search bar optimizovan za telefon */
    .search-wrapper {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box {
      width: 100%;
      padding: 0.85rem 3rem 0.85rem 2.85rem;
      font-size: 1rem;
      border: 1px solid var(--search-border);
      border-radius: 9999px;
      background: var(--search-bg);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      box-shadow: var(--card-shadow);
      -webkit-appearance: none;
    }

    .search-box:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2), var(--card-shadow);
      background: var(--search-focus-bg);
    }

    .search-icon-btn {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.4rem;
      height: 1.4rem;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
    }

    .search-icon-btn svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-clear-btn {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.7rem;
      height: 1.7rem;
      background: var(--search-btn-bg);
      border: none;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1;
      padding: 0;
    }

    .search-clear-btn.visible {
      display: flex;
    }

    /* Vertikalni niz kartica na telefonu, multi-column grid na većim ekranima */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      width: 100%;
    }

    @media (min-width: 768px) {
      .stack {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.25rem;
        align-items: start;
      }
    }

    @media (min-width: 1100px) {
      .stack {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        align-items: start;
      }
    }

    @media (min-width: 1440px) {
      .stack {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        align-items: start;
      }
    }

    /* Kartica kategorije sa harmonika preklapanjem */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: border-color 0.15s ease;
    }

    .card.hidden {
      display: none !important;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.1rem;
      background: var(--card-header-bg);
      border-bottom: 1px solid var(--card-border);
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .card-header:active {
      background-color: var(--card-hover);
    }

    .card.collapsed .card-header {
      border-bottom: none;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .card-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-title);
      letter-spacing: 0.2px;
    }

    .card-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--badge-color);
      background: var(--badge-bg);
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
    }

    .card-chevron {
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.22s ease;
    }

    .card.collapsed .card-chevron {
      transform: rotate(-90deg);
    }

    /* Card Body */
    .card-body {
      padding: 0.35rem 0.4rem;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    .card.collapsed .card-body {
      display: none;
    }

    /* Link item optimizovan za dodir (touch target) */
    .link-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.7rem 0.75rem;
      text-decoration: none;
      color: inherit;
      border-radius: 10px;
      transition: background-color 0.12s ease;
      min-height: 48px;
      border-bottom: 1px solid var(--link-border);
    }

    .link-item:last-child {
      border-bottom: none;
    }

    .link-item:active {
      background-color: var(--link-hover);
      transform: scale(0.99);
    }

    .link-item.hidden {
      display: none !important;
    }

    .link-favicon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      flex-shrink: 0;
      background: var(--favicon-bg);
      object-fit: contain;
    }

    .link-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .link-name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-link);
      line-height: 1.25;
    }

    .link-item:active .link-name {
      color: var(--accent-color);
    }

    .link-domain {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* Highlight pretrage */
    mark {
      background: var(--mark-bg);
      color: var(--mark-color);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Footer */
    footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Lock Ekran -->
  <div id="lockScreen">
    <div class="lock-top-bar">
      <button class="icon-btn theme-toggle-btn" title="Promeni temu (Svetla / Tamna)" aria-label="Promeni temu">
        <svg class="themeIcon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="21" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <div class="lock-title">Startpage</div>
    <div class="lock-subtitle">Unesite lozinku za pristup vašim bookmarkima</div>

    <form class="pwd-form" id="pwdForm" onsubmit="event.preventDefault(); submitPassword();">
      <div class="pwd-input-wrapper">
        <input type="password" id="passwordInput" class="pwd-box" placeholder="Lozinka..." autocomplete="current-password" autofocus>
        <button type="button" class="pwd-toggle-btn" id="togglePwd" title="Prikaži ili sakrij lozinku">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <button type="submit" class="unlock-btn">Otključaj</button>
      <div class="pwd-error" id="lockError"></div>
    </form>
  </div>

  <!-- Glavni Dashboard Sadržaj (otključava se dekripcijom u memoriji) -->
  <div id="dashboardContent">
    <header>
      <div class="search-row">
        <div class="search-wrapper">
          <button class="search-icon-btn" id="searchBtn" title="Traži na Google">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <input type="text" id="searchInput" class="search-box" placeholder="Pretraži ili Google pretraga..." autocomplete="off">
          <button class="search-clear-btn" id="searchClearBtn" title="Obriši">×</button>
        </div>

        <button class="icon-btn" id="lockBtn" title="Zaključaj stranicu" aria-label="Zaključaj stranicu">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>

        <button class="icon-btn theme-toggle-btn" id="themeToggle" title="Promeni temu (Svetla / Tamna)" aria-label="Promeni temu">
          <svg class="themeIcon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="21" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="stack" id="bookmarkStack">
      <!-- Dekriptovani sadržaj se ubacuje ovde -->
    </main>

    <footer>
      <span>Mobile Startpage · aLexLibris</span>
      <span>Ažurirano: 15.11.2026. u 21:31:04</span>
    </footer>
  </div>

  <script>
    // Theme Toggle (Svetla / Tamna)
    const sunSvg = `
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="21" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    `;

    const moonSvg = `
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    `;

    const systemDarkQuery = window.matchMedia("(prefers-color-scheme: dark)");
    localStorage.removeItem("theme");

    function getSystemTheme() {
      return systemDarkQuery.matches ? "dark" : "light";
    }

    function getEffectiveTheme() {
      const manual = sessionStorage.getItem("manual_theme");
      if (manual === "dark" || manual === "light") {
        return manual;
      }
      return getSystemTheme();
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelectorAll(".themeIcon").forEach(ic => {
        if (theme === "light") {
          ic.innerHTML = moonSvg;
        } else {
          ic.innerHTML = sunSvg;
        }
      });
    }

    applyTheme(getEffectiveTheme());

    systemDarkQuery.addEventListener("change", (e) => {
      sessionStorage.removeItem("manual_theme");
      applyTheme(e.matches ? "dark" : "light");
    });

    document.querySelectorAll(".theme-toggle-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || getSystemTheme();
        const next = current === "dark" ? "light" : "dark";
        sessionStorage.setItem("manual_theme", next);
        applyTheme(next);
      });
    });

    // Otvaranje / zatvaranje kartice na klik naslova
    function toggleCard(headerEl) {
      const card = headerEl.closest(".card");
      if (card) {
        card.classList.toggle("collapsed");
      }
    }

    // WebCrypto AES-GCM Dekripcija
    async function decryptWithPin(pin, payload) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
      const ciphertext = Uint8Array.from(atob(payload.ciphertext), c => c.charCodeAt(0));

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(pin),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const key = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decrypted);
    }

    // Upravljanje unosom lozinke
    const pwdInput = document.getElementById('passwordInput');
    const pwdToggle = document.getElementById('togglePwd');

    if (pwdToggle && pwdInput) {
      pwdToggle.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
        } else {
          pwdInput.type = 'password';
        }
      });
    }

    async function attemptUnlock(secret) {
      const payloadEl = document.getElementById('encryptedPayload');
      if (!payloadEl) return;
      try {
        const payload = JSON.parse(payloadEl.textContent.trim());
        const decryptedHtml = await decryptWithPin(secret, payload);
        
        // Uspešno dekriptovano!
        localStorage.setItem('startpage_secret', secret);
        localStorage.removeItem('startpage_pin');
        
        const stackEl = document.getElementById('bookmarkStack');
        stackEl.innerHTML = decryptedHtml;
        
        document.getElementById('lockScreen').style.display = 'none';
        const dashboard = document.getElementById('dashboardContent');
        dashboard.classList.add('visible');
        initSearch();
      } catch (err) {
        // Netačna lozinka
        const formEl = document.getElementById('pwdForm');
        if (formEl) {
          formEl.classList.add('shake');
          const errEl = document.getElementById('lockError');
          if (errEl) errEl.textContent = 'Pogrešna lozinka!';
          setTimeout(() => {
            formEl.classList.remove('shake');
          }, 400);
        }
      }
    }

    function submitPassword() {
      if (!pwdInput) return;
      const val = pwdInput.value.trim();
      if (val) {
        attemptUnlock(val);
      }
    }

    // Dugme za ručno zaključavanje
    const lockBtn = document.getElementById('lockBtn');
    if (lockBtn) {
      lockBtn.addEventListener('click', () => {
        localStorage.removeItem('startpage_secret');
        localStorage.removeItem('startpage_pin');
        location.reload();
      });
    }

    // Proveri da li je lozinka već sačuvana na uređaju
    const savedSecret = localStorage.getItem('startpage_secret');
    if (savedSecret) {
      attemptUnlock(savedSecret);
    }

    // Inicijalizacija pretrage nakon otključavanja
    function initSearch() {
      const searchInput = document.getElementById('searchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');
      const searchBtn = document.getElementById('searchBtn');
      const cards = document.querySelectorAll('.card');
      const linkItems = document.querySelectorAll('.link-item');

      function performGoogleSearch(query) {
        if (!query) return;
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }

      if (!searchInput) return;

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();

        if (query.length > 0) {
          searchClearBtn.classList.add('visible');
        } else {
          searchClearBtn.classList.remove('visible');
        }

        if (!query) {
          cards.forEach(c => {
            c.classList.remove('hidden');
            if (c.getAttribute('data-default-collapsed') === 'true') {
              c.classList.add('collapsed');
            } else {
              c.classList.remove('collapsed');
            }
          });
          linkItems.forEach(l => {
            l.classList.remove('hidden');
            const nameSpan = l.querySelector('.link-name');
            if (nameSpan && nameSpan.dataset.original) {
              nameSpan.innerHTML = nameSpan.dataset.original;
            }
          });
          return;
        }

        cards.forEach(card => {
          const links = card.querySelectorAll('.link-item');
          let visibleCount = 0;

          links.forEach(link => {
            const name = link.getAttribute('data-name') || '';
            const domain = link.getAttribute('data-domain') || '';
            const nameSpan = link.querySelector('.link-name');
            if (!nameSpan.dataset.original) {
              nameSpan.dataset.original = nameSpan.textContent;
            }

            if (name.includes(query) || domain.includes(query)) {
              link.classList.remove('hidden');
              visibleCount++;

              const orig = nameSpan.dataset.original;
              const idx = orig.toLowerCase().indexOf(query);
              if (idx !== -1) {
                const before = orig.substring(0, idx);
                const match = orig.substring(idx, idx + query.length);
                const after = orig.substring(idx + query.length);
                nameSpan.innerHTML = before + '<mark>' + match + '</mark>' + after;
              } else {
                nameSpan.textContent = orig;
              }
            } else {
              link.classList.add('hidden');
            }
          });

          if (visibleCount > 0) {
            card.classList.remove('hidden');
            card.classList.remove('collapsed');
          } else {
            card.classList.add('hidden');
          }
        });
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const query = searchInput.value.trim();
          if (!query) return;

          const visibleLinks = Array.from(linkItems).filter(l => !l.classList.contains('hidden'));
          if (visibleLinks.length === 1) {
            window.location.href = visibleLinks[0].href;
          } else {
            performGoogleSearch(query);
          }
        }
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input'));
        searchInput.focus();
      });

      searchBtn.addEventListener('click', () => {
        const query = searchInput.value.trim();
        if (query) {
          performGoogleSearch(query);
        } else {
          searchInput.focus();
        }
      });
    }
  </script>
</body>
</html>
