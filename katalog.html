<!DOCTYPE html>
<html lang="sr">
<head>

<title>aLexLibris · Etsy Katalog Proizvoda</title>

<style>
  :root {
    --bg-dark: #121316;
    --bg-surface: #1a1b20;
    --bg-card: #202127;
    --bg-card-hover: #272831;
    --border-color: #2f313a;
    --border-accent: #5a4628;
    --text-primary: #f2efe9;
    --text-secondary: #abaaa4;
    --text-muted: #787774;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --gold-glow: rgba(212, 175, 55, 0.25);
    --accent-blue: #3b82f6;
    --accent-red: #ef4444;

    --header-bg: rgba(18, 19, 22, 0.95);
    --header-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    --card-hover-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--gold-glow);
    --brand-title: #f3e5ab;
    --section-title: #f3e5ab;
    --count-bg: #2f313a;
    --img-bg: #0f1013;
    --overlay-bg: rgba(18, 19, 23, 0.95);
    --overlay-text: #e5e5e3;
    --tag-bg: rgba(255, 255, 255, 0.08);
    --tag-border: rgba(255, 255, 255, 0.1);
    --badge-bg: rgba(18, 19, 22, 0.9);
    --badge-price-text: #f3e5ab;
    --badge-fav-text: #f3e5ab;
    --btn-gold-text: #121316;
    --theme-btn-bg: #1a1b20;
    --theme-btn-border: #2f313a;
    --theme-btn-hover: #272831;
    --color-scheme: dark;
  }

  /* Automatsko praćenje svetle teme sistema uređaja (laptop / telefon) */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-dark: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --border-accent: #d4af37;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --gold: #9a7418;
      --gold-light: #78350f;
      --gold-glow: rgba(212, 175, 55, 0.2);
      --accent-blue: #2563eb;
      --accent-red: #dc2626;

      --header-bg: rgba(255, 255, 255, 0.95);
      --header-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
      --card-hover-shadow: 0 12px 28px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(212, 175, 55, 0.35);
      --brand-title: #78350f;
      --section-title: #78350f;
      --count-bg: #e2e8f0;
      --img-bg: #f1f5f9;
      --overlay-bg: rgba(255, 255, 255, 0.97);
      --overlay-text: #1e293b;
      --tag-bg: rgba(0, 0, 0, 0.05);
      --tag-border: rgba(0, 0, 0, 0.08);
      --badge-bg: rgba(255, 255, 255, 0.92);
      --badge-price-text: #78350f;
      --badge-fav-text: #78350f;
      --btn-gold-text: #ffffff;
      --theme-btn-bg: #ffffff;
      --theme-btn-border: #cbd5e1;
      --theme-btn-hover: #f1f5f9;
      --color-scheme: light;
    }
  }

  /* Eksplicitna tema preko data-theme atributa */
  [data-theme="light"] {
    --bg-dark: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #f1f5f9;
    --border-color: #e2e8f0;
    --border-accent: #d4af37;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --gold: #9a7418;
    --gold-light: #78350f;
    --gold-glow: rgba(212, 175, 55, 0.2);
    --accent-blue: #2563eb;
    --accent-red: #dc2626;

    --header-bg: rgba(255, 255, 255, 0.95);
    --header-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
    --card-hover-shadow: 0 12px 28px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(212, 175, 55, 0.35);
    --brand-title: #78350f;
    --section-title: #78350f;
    --count-bg: #e2e8f0;
    --img-bg: #f1f5f9;
    --overlay-bg: rgba(255, 255, 255, 0.97);
    --overlay-text: #1e293b;
    --tag-bg: rgba(0, 0, 0, 0.05);
    --tag-border: rgba(0, 0, 0, 0.08);
    --badge-bg: rgba(255, 255, 255, 0.92);
    --badge-price-text: #78350f;
    --badge-fav-text: #78350f;
    --btn-gold-text: #ffffff;
    --theme-btn-bg: #ffffff;
    --theme-btn-border: #cbd5e1;
    --theme-btn-hover: #f1f5f9;
    --color-scheme: light;
  }

  [data-theme="dark"] {
    --bg-dark: #121316;
    --bg-surface: #1a1b20;
    --bg-card: #202127;
    --bg-card-hover: #272831;
    --border-color: #2f313a;
    --border-accent: #5a4628;
    --text-primary: #f2efe9;
    --text-secondary: #abaaa4;
    --text-muted: #787774;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --gold-glow: rgba(212, 175, 55, 0.25);
    --accent-blue: #3b82f6;
    --accent-red: #ef4444;

    --header-bg: rgba(18, 19, 22, 0.95);
    --header-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    --card-hover-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--gold-glow);
    --brand-title: #f3e5ab;
    --section-title: #f3e5ab;
    --count-bg: #2f313a;
    --img-bg: #0f1013;
    --overlay-bg: rgba(18, 19, 23, 0.95);
    --overlay-text: #e5e5e3;
    --tag-bg: rgba(255, 255, 255, 0.08);
    --tag-border: rgba(255, 255, 255, 0.1);
    --badge-bg: rgba(18, 19, 22, 0.9);
    --badge-price-text: #f3e5ab;
    --badge-fav-text: #f3e5ab;
    --btn-gold-text: #121316;
    --theme-btn-bg: #1a1b20;
    --theme-btn-border: #2f313a;
    --theme-btn-hover: #272831;
    --color-scheme: dark;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    color-scheme: var(--color-scheme);
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: 80px;
    min-height: 100vh;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* Dugmad za temu (ikona Sunce / Mesec) */
  .icon-btn {
    background: var(--theme-btn-bg);
    border: 1px solid var(--theme-btn-border);
    color: var(--text-primary);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .icon-btn:hover {
    background: var(--theme-btn-hover);
    border-color: var(--gold);
    color: var(--gold);
  }

  .icon-btn:active {
    transform: scale(0.95);
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  /* Lock Screen */
  #lockScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    gap: 1.25rem;
    padding: 1.5rem;
  }

  .lock-top-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    width: 100%;
    max-width: 320px;
    margin-bottom: -6px;
  }

  .lock-icon {
    width: 60px;
    height: 60px;
    color: var(--gold);
    margin-bottom: 0.25rem;
  }

  .lock-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--brand-title);
    letter-spacing: -0.5px;
  }

  .lock-subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    max-width: 300px;
    line-height: 1.45;
  }

  .pwd-form {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
    max-width: 320px;
    margin-top: 0.5rem;
  }

  .pwd-input-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  .pwd-box {
    width: 100%;
    padding: 0.85rem 2.85rem 0.85rem 1rem;
    font-size: 1.05rem;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    background: var(--bg-surface);
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
    -webkit-appearance: none;
  }

  .pwd-box:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  .pwd-toggle-btn {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.3rem;
  }

  .pwd-toggle-btn svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .unlock-btn {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    background: var(--gold);
    color: var(--btn-gold-text);
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .unlock-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .pwd-error {
    color: var(--accent-red);
    font-size: 0.85rem;
    min-height: 1.2rem;
    font-weight: 500;
  }

  .shake {
    animation: shakeAnim 0.35s ease;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* Catalog Container (Prikazuje se nakon dekripcije) */
  #catalogContent {
    display: none;
  }

  /* Top Sticky Bar sa automatskim skrivanjem pri skrolovanju */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 32px;
    box-shadow: var(--header-shadow);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, border-color 0.2s ease;
    will-change: transform;
  }

  .header.header-hidden {
    transform: translateY(-100%);
  }

  .header-inner {
    max-width: 1680px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--brand-title);
  }

  .brand span {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .nav-pills {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-pill {
    background: var(--bg-surface);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-pill:hover, .nav-pill.active {
    background: var(--gold);
    color: var(--btn-gold-text);
    border-color: var(--gold);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 7px 18px;
    width: 320px;
    transition: border-color 0.2s ease;
  }

  .search-box:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 14px;
    width: 100%;
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }

  /* Main Container */
  .container {
    max-width: 1680px;
    margin: 32px auto;
    padding: 0 32px;
  }

  .section-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
    gap: 16px;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--section-title);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-count {
    background: var(--count-bg);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 12px;
  }

  .section-hint {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Filter Controls */
  .filter-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 28px;
  }

  .filter-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold);
    margin-right: 4px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .filter-divider {
    width: 1px;
    height: 24px;
    background: var(--border-color);
    margin: 0 6px;
  }

  .filter-btn {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    color: var(--text-primary);
    border-color: var(--gold);
  }

  .filter-btn.active {
    background: var(--gold);
    color: var(--btn-gold-text);
    border-color: var(--gold);
    font-weight: 700;
  }

  /* GRIDS: 4 ITEMS PER ROW (Desktop) */
  .grid-active,
  .grid-thumbs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px;
  }

  @media (max-width: 1320px) {
    .grid-active,
    .grid-thumbs {
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
  }

  /* Product Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .card:hover {
    transform: translateY(-5px);
    border-color: var(--gold);
    box-shadow: var(--card-hover-shadow);
  }

  /* Image Container & Hover Overlay */
  .image-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--img-bg);
  }

  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .card:hover .image-wrapper img {
    transform: scale(1.05);
  }

  /* Desktop Hover Overlay */
  .hover-overlay {
    position: absolute;
    inset: 0;
    background: var(--overlay-bg);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s ease;
    display: flex;
    flex-direction: column;
    padding: 18px;
    z-index: 10;
    overflow: hidden;
  }

  .card:hover .hover-overlay,
  .thumb-card:hover .hover-overlay {
    opacity: 1;
    visibility: visible;
  }

  .hover-overlay-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    padding-bottom: 4px;
  }

  .hover-desc {
    font-size: 14px;
    color: var(--overlay-text);
    line-height: 1.55;
    overflow-y: auto;
    margin-bottom: 12px;
    padding-right: 6px;
    flex-grow: 1;
    min-height: 160px;
  }

  .hover-desc::-webkit-scrollbar,
  .hover-tags::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }

  .hover-desc::-webkit-scrollbar-track,
  .hover-tags::-webkit-scrollbar-track {
    background: transparent;
  }

  .hover-desc::-webkit-scrollbar-thumb,
  .hover-tags::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  .hover-desc::-webkit-scrollbar-thumb:hover,
  .hover-tags::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
  }

  .hover-tags-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .hover-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    overflow-y: auto;
    max-height: 95px;
    padding-right: 4px;
  }

  .hover-tag {
    font-size: 11px;
    background: var(--tag-bg);
    color: var(--text-secondary);
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid var(--tag-border);
  }

  .hover-tag.highlight-lined {
    background: rgba(59, 130, 246, 0.25);
    color: #93c5fd;
    border-color: rgba(59, 130, 246, 0.4);
    font-weight: 600;
  }

  /* Badges on Image (Desktop & Mobile) */
  .badge-price {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--badge-bg);
    backdrop-filter: blur(6px);
    color: var(--badge-price-text);
    font-weight: 700;
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid var(--border-accent);
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  .badge-lined {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(30, 58, 138, 0.9);
    backdrop-filter: blur(6px);
    color: #bfdbfe;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid rgba(59, 130, 246, 0.5);
    z-index: 5;
  }

  .badge-fav {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: var(--badge-bg);
    backdrop-filter: blur(6px);
    color: var(--badge-fav-text);
    font-weight: 700;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .badge-sold {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(185, 28, 28, 0.92);
    color: #fee2e2;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 5;
  }

  .badge-inactive {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(75, 85, 99, 0.92);
    color: #e5e7eb;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 5;
  }

  /* Card Content */
  .card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-title, .thumb-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.45;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .card-title:hover, .thumb-title:hover {
    color: var(--gold);
  }

  .title-desktop {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title-mobile {
    display: none;
  }

  /* Thumb Card */
  .thumb-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .thumb-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: var(--card-hover-shadow);
  }

  .thumb-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--img-bg);
  }

  .thumb-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .thumb-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 60px;
    padding: 24px;
    border-top: 1px solid var(--border-color);
  }

  .hidden {
    display: none !important;
  }

  /* ========================================= */
  /* MOBILNA & LANDSCAPE OPTIMIZACIJA          */
  /* ========================================= */
  @media (max-width: 768px), (orientation: landscape) and (max-height: 550px) {
    /* U mobilnoj verziji ne treba opis i tagovi */
    .hover-overlay {
      display: none !important;
    }

    /* Naslov: vidi se samo deo do dimenzije */
    .title-desktop {
      display: none !important;
    }
    .title-mobile {
      display: -webkit-box !important;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px !important;
      line-height: 1.35 !important;
      font-weight: 600 !important;
      color: var(--text-primary);
    }

    /* Skalirani bedževi preko slike */
    .badge-price {
      top: 6px !important;
      right: 6px !important;
      font-size: 11px !important;
      padding: 3px 7px !important;
      border-radius: 12px !important;
    }
    .badge-lined, .badge-sold, .badge-inactive {
      top: 6px !important;
      left: 6px !important;
      font-size: 9px !important;
      padding: 2px 6px !important;
      border-radius: 8px !important;
    }
    .badge-fav {
      bottom: 6px !important;
      right: 6px !important;
      font-size: 10px !important;
      padding: 2px 6px !important;
      border-radius: 8px !important;
    }

    .card-body, .thumb-body {
      padding: 8px 10px !important;
    }

    /* Header i navigacija */
    .header {
      padding: 10px 14px !important;
    }
    .header-inner {
      gap: 8px !important;
    }
    .brand h1 {
      font-size: 20px !important;
    }
    .header-actions {
      width: 100% !important;
      gap: 8px !important;
    }
    .search-box {
      width: auto !important;
      flex: 1 !important;
    }
    .icon-btn {
      width: 36px !important;
      height: 36px !important;
    }
    .icon-btn svg {
      width: 18px !important;
      height: 18px !important;
    }
    .nav-pills {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .nav-pill {
      padding: 6px 12px !important;
      font-size: 12px !important;
    }

    /* Filter kontrole na telefonu */
    .filter-controls {
      padding: 8px 10px !important;
      gap: 6px !important;
      margin-bottom: 16px !important;
    }
    .filter-group {
      overflow-x: auto;
      white-space: nowrap;
      max-width: 100%;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      padding: 5px 10px !important;
      font-size: 12px !important;
    }
    .filter-divider {
      display: none !important;
    }

    .container {
      margin: 16px auto !important;
      padding: 0 12px !important;
    }
    .section-header {
      margin-bottom: 12px !important;
      padding-bottom: 6px !important;
      gap: 6px !important;
    }
    .section-title {
      font-size: 17px !important;
    }
    .section-count {
      font-size: 11px !important;
      padding: 2px 8px !important;
    }
  }

  /* 2 proizvoda u redu za vertikalni mobilni prikaz (Portrait) */
  @media (max-width: 768px) and (orientation: portrait), (max-width: 540px) {
    .grid-active,
    .grid-thumbs {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 12px !important;
    }
  }

  /* 3 proizvoda u redu za horizontalni mobilni prikaz (Landscape telefon) */
  @media (orientation: landscape) and (max-height: 550px), (min-width: 541px) and (max-width: 950px) and (orientation: landscape) {
    .grid-active,
    .grid-thumbs {
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 12px !important;
    }
  }
</style>
</head>

<script>
  // Upravljanje temom (Dark / Light) - automatski prati temu uredjaja (telefon & laptop)
  const systemDarkQuery = window.matchMedia("(prefers-color-scheme: dark)");

  const sunSvg = `<svg class="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

  const moonSvg = `<svg class="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  function getSystemTheme() {
    return systemDarkQuery.matches ? "dark" : "light";
  }

  function getEffectiveTheme() {
    const manual = sessionStorage.getItem("catalog_theme");
    if (manual === "dark" || manual === "light") {
      return manual;
    }
    return getSystemTheme();
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll(".theme-toggle-btn").forEach(btn => {
      btn.innerHTML = (theme === "light") ? moonSvg : sunSvg;
      btn.setAttribute("title", theme === "light" ? "Prebaci na tamnu temu" : "Prebaci na svetlu temu");
      btn.setAttribute("aria-label", theme === "light" ? "Prebaci na tamnu temu" : "Prebaci na svetlu temu");
    });
  }

  // Primeni temu odmah
  applyTheme(getEffectiveTheme());

  // Kada se na telefonu ili laptopu promeni sistemska dark/light tema
  systemDarkQuery.addEventListener("change", (e) => {
    sessionStorage.removeItem("catalog_theme");
    applyTheme(e.matches ? "dark" : "light");
  });

  // Klik na dugme za promenu teme (i na lock screen-u i unutar kataloga)
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".theme-toggle-btn");
    if (btn) {
      const current = document.documentElement.getAttribute("data-theme") || getSystemTheme();
      const next = (current === "dark") ? "light" : "dark";
      sessionStorage.setItem("catalog_theme", next);
      applyTheme(next);
    }
  });

  // WebCrypto AES-GCM Dekripcija
  async function decryptWithPin(pin, payload) {
    const enc = new TextEncoder();
    const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
    const ciphertext = Uint8Array.from(atob(payload.ciphertext), c => c.charCodeAt(0));

    const keyMaterial = await window.crypto.subtle.importKey(
      "raw",
      enc.encode(pin),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );

    const key = await window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const decrypted = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      ciphertext
    );

    return new TextDecoder().decode(decrypted);
  }

  const pwdInput = document.getElementById("passwordInput");
  const pwdToggle = document.getElementById("togglePwd");

  if (pwdToggle && pwdInput) {
    pwdToggle.addEventListener("click", () => {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
      } else {
        pwdInput.type = "password";
      }
    });
  }

  async function attemptUnlock(secret) {
    const payloadEl = document.getElementById("encryptedPayload");
    if (!payloadEl) return;
    try {
      const payload = JSON.parse(payloadEl.textContent.trim());
      const decryptedHtml = await decryptWithPin(secret, payload);
      
      // Sačuvaj lozinku u localStorage ako već nije tu
      localStorage.setItem("startpage_secret", secret);
      
      const contentEl = document.getElementById("catalogContent");
      contentEl.innerHTML = decryptedHtml;
      
      document.getElementById("lockScreen").style.display = "none";
      contentEl.style.display = "block";
      applyTheme(getEffectiveTheme());
      initCatalog();
    } catch (err) {
      const formEl = document.getElementById("pwdForm");
      if (formEl) {
        formEl.classList.add("shake");
        const errEl = document.getElementById("lockError");
        if (errEl) errEl.textContent = "Pogrešna lozinka!";
        setTimeout(() => {
          formEl.classList.remove("shake");
        }, 400);
      }
    }
  }

  function submitPassword() {
    if (!pwdInput) return;
    const val = pwdInput.value.trim();
    if (val) {
      attemptUnlock(val);
    }
  }

  // Ako korisnik već ima sačuvanu šifru na računaru ili telefonu, otključaj instant
  const savedSecret = localStorage.getItem("startpage_secret");
  if (savedSecret) {
    attemptUnlock(savedSecret);
  }

  // Inicijalizacija JavaScript filtera i pretrage nakon otključavanja
  function initCatalog() {
    const searchInput = document.getElementById("liveSearch");
    const statusBtns = document.querySelectorAll("#statusTabs .nav-pill");

    const activeSection = document.getElementById("active-section");
    const soldSection = document.getElementById("sold-section");
    const inactiveSection = document.getElementById("inactive-section");

    const activeCards = document.querySelectorAll("#activeGrid .card");
    const soldCards = document.querySelectorAll("#soldGrid .thumb-card");
    const inactiveCards = document.querySelectorAll("#inactiveGrid .thumb-card");

    const activeCountBadge = document.getElementById("activeCountBadge");
    const soldCountBadge = document.getElementById("soldCountBadge");
    const inactiveCountBadge = document.getElementById("inactiveCountBadge");

    const catBtns = document.querySelectorAll("#categoryFilters .filter-btn");
    const paperBtns = document.querySelectorAll("#paperFilters .filter-btn");
    const noResultsEl = document.getElementById("noResults");

    let currentStatus = "active";
    let selectedCategory = "all";
    let selectedPaper = "all";

    function applyFilters() {
      const query = (searchInput.value || "").trim().toLowerCase();

      const showActive = (currentStatus === "active");
      const showSold = (currentStatus === "sold");
      const showInactive = (currentStatus === "inactive");

      let activeVisible = 0;
      let soldVisible = 0;
      let inactiveVisible = 0;

      // 1. Filtriranje aktivnih
      if (showActive) {
        activeCards.forEach(card => {
          const title = card.getAttribute("data-title") || "";
          const tags = card.getAttribute("data-tags") || "";
          const cat = card.getAttribute("data-cat") || "";
          const paper = card.getAttribute("data-paper") || "";

          const matchesSearch = !query || title.includes(query) || tags.includes(query);
          const matchesCat = (selectedCategory === "all") || (cat === selectedCategory);
          const matchesPaper = (selectedPaper === "all") || (paper === selectedPaper);

          if (matchesSearch && matchesCat && matchesPaper) {
            card.classList.remove("hidden");
            activeVisible++;
          } else {
            card.classList.add("hidden");
          }
        });

        activeSection.style.display = (query && activeVisible === 0) ? "none" : "block";
        if (activeCountBadge) activeCountBadge.textContent = activeVisible;
      } else {
        activeSection.style.display = "none";
      }

      // 2. Filtriranje prodatih (Sold Out)
      if (showSold) {
        soldCards.forEach(card => {
          const title = card.getAttribute("data-title") || "";
          const tags = card.getAttribute("data-tags") || "";
          const matchesSearch = !query || title.includes(query) || tags.includes(query);

          if (matchesSearch) {
            card.classList.remove("hidden");
            soldVisible++;
          } else {
            card.classList.add("hidden");
          }
        });

        soldSection.style.display = (query && soldVisible === 0) ? "none" : "block";
        if (soldCountBadge) soldCountBadge.textContent = soldVisible;
      } else {
        soldSection.style.display = "none";
      }

      // 3. Filtriranje neaktivnih (Inactive)
      if (showInactive) {
        inactiveCards.forEach(card => {
          const title = card.getAttribute("data-title") || "";
          const tags = card.getAttribute("data-tags") || "";
          const matchesSearch = !query || title.includes(query) || tags.includes(query);

          if (matchesSearch) {
            card.classList.remove("hidden");
            inactiveVisible++;
          } else {
            card.classList.add("hidden");
          }
        });

        inactiveSection.style.display = (query && inactiveVisible === 0) ? "none" : "block";
        if (inactiveCountBadge) inactiveCountBadge.textContent = inactiveVisible;
      } else {
        inactiveSection.style.display = "none";
      }

      const totalVisible = (showActive ? activeVisible : 0) + (showSold ? soldVisible : 0) + (showInactive ? inactiveVisible : 0);
      if (noResultsEl) {
        if (totalVisible === 0) {
          noResultsEl.classList.remove("hidden");
        } else {
          noResultsEl.classList.add("hidden");
        }
      }
    }

    statusBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        statusBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentStatus = btn.getAttribute("data-status") || "active";

        if (currentStatus === "active") {
          searchInput.placeholder = "Pretraži aktivne proizvode (naslov, tagovi)...";
        } else if (currentStatus === "sold") {
          searchInput.placeholder = "Pretraži prodate proizvode (Sold Out)...";
        } else if (currentStatus === "inactive") {
          searchInput.placeholder = "Pretraži neaktivne proizvode (Inactive)...";
        }

        applyFilters();
      });
    });

    if (searchInput) {
      searchInput.addEventListener("input", applyFilters);
      searchInput.addEventListener("focus", () => {
        const headerEl = document.querySelector(".header");
        if (headerEl) headerEl.classList.remove("header-hidden");
      });
    }

    catBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        catBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCategory = btn.getAttribute("data-cat") || "all";
        applyFilters();
      });
    });

    paperBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        paperBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPaper = btn.getAttribute("data-paper") || "all";
        applyFilters();
      });
    });

    // Skrivanje zaglavlja (brend, status tabovi, search) pri skrolovanju na dole
    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    window.addEventListener("scroll", () => {
      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
      const headerEl = document.querySelector(".header");
      if (!headerEl) return;

      if (currentScrollY <= 20) {
        headerEl.classList.remove("header-hidden");
        lastScrollY = currentScrollY;
        return;
      }

      if (Math.abs(currentScrollY - lastScrollY) < 6) {
        return;
      }

      if (currentScrollY > lastScrollY && currentScrollY > 70) {
        headerEl.classList.add("header-hidden");
      } else if (currentScrollY < lastScrollY) {
        headerEl.classList.remove("header-hidden");
      }

      lastScrollY = currentScrollY;
    }, { passive: true });

    // Inicijalno primeni filtere
    applyFilters();
  }
</script>

</body>
</html>
