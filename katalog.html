<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>aLexLibris · Etsy Katalog Proizvoda</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23d4af37%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4 19.5A2.5 2.5 0 0 1 6.5 17H20%22/%3E%3Cpath d=%22M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg-dark: #121316;
    --bg-surface: #1a1b20;
    --bg-card: #202127;
    --bg-card-hover: #272831;
    --border-color: #2f313a;
    --border-accent: #5a4628;
    --text-primary: #f2efe9;
    --text-secondary: #abaaa4;
    --text-muted: #787774;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --gold-glow: rgba(212, 175, 55, 0.25);
    --accent-blue: #3b82f6;
    --accent-red: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: 80px;
    min-height: 100vh;
  }

  /* Lock Screen */
  #lockScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    gap: 1.25rem;
    padding: 1.5rem;
  }

  .lock-icon {
    width: 60px;
    height: 60px;
    color: var(--gold);
    margin-bottom: 0.25rem;
  }

  .lock-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: -0.5px;
  }

  .lock-subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    max-width: 300px;
    line-height: 1.45;
  }

  .pwd-form {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
    max-width: 320px;
    margin-top: 0.5rem;
  }

  .pwd-input-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }

  .pwd-box {
    width: 100%;
    padding: 0.85rem 2.85rem 0.85rem 1rem;
    font-size: 1.05rem;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    background: var(--bg-surface);
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
    -webkit-appearance: none;
  }

  .pwd-box:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  .pwd-toggle-btn {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.3rem;
  }

  .pwd-toggle-btn svg {
    width: 1.25rem;
    height: 1.25rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .unlock-btn {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 12px;
    background: var(--gold);
    color: #121316;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .unlock-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .pwd-error {
    color: var(--accent-red);
    font-size: 0.85rem;
    min-height: 1.2rem;
    font-weight: 500;
  }

  .shake {
    animation: shakeAnim 0.35s ease;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* Catalog Container (Prikazuje se nakon dekripcije) */
  #catalogContent {
    display: none;
  }

  /* Top Sticky Bar sa automatskim skrivanjem pri skrolovanju */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(18, 19, 22, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 32px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }

  .header.header-hidden {
    transform: translateY(-100%);
  }

  .header-inner {
    max-width: 1680px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .brand h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--gold-light);
  }

  .brand span {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .nav-pills {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .nav-pill {
    background: var(--bg-surface);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nav-pill:hover, .nav-pill.active {
    background: var(--gold);
    color: #121316;
    border-color: var(--gold);
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 7px 18px;
    width: 340px;
    transition: border-color 0.2s ease;
  }

  .search-box:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 14px;
    width: 100%;
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }

  /* Main Container */
  .container {
    max-width: 1680px;
    margin: 32px auto;
    padding: 0 32px;
  }

  .section-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
    gap: 16px;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold-light);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-count {
    background: var(--border-color);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 12px;
  }

  .section-hint {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Filter Controls */
  .filter-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 28px;
  }

  .filter-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold);
    margin-right: 4px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .filter-divider {
    width: 1px;
    height: 24px;
    background: var(--border-color);
    margin: 0 6px;
  }

  .filter-btn {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    color: var(--text-primary);
    border-color: var(--gold);
  }

  .filter-btn.active {
    background: var(--gold);
    color: #121316;
    border-color: var(--gold);
    font-weight: 700;
  }

  /* GRIDS: 4 ITEMS PER ROW (Desktop) */
  .grid-active,
  .grid-thumbs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px;
  }

  @media (max-width: 1320px) {
    .grid-active,
    .grid-thumbs {
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
  }

  /* Product Card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .card:hover {
    transform: translateY(-5px);
    border-color: var(--gold);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--gold-glow);
  }

  /* Image Container & Hover Overlay */
  .image-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #0f1013;
  }

  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .card:hover .image-wrapper img {
    transform: scale(1.05);
  }

  /* Desktop Hover Overlay */
  .hover-overlay {
    position: absolute;
    inset: 0;
    background: rgba(18, 19, 23, 0.94);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s ease;
    display: flex;
    flex-direction: column;
    padding: 18px;
    z-index: 10;
    overflow: hidden;
  }

  .card:hover .hover-overlay,
  .thumb-card:hover .hover-overlay {
    opacity: 1;
    visibility: visible;
  }

  .hover-overlay-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    padding-bottom: 4px;
  }

  .hover-desc {
    font-size: 14px;
    color: #e5e5e3;
    line-height: 1.55;
    overflow-y: auto;
    margin-bottom: 12px;
    padding-right: 6px;
    flex-grow: 1;
    min-height: 160px;
  }

  .hover-desc::-webkit-scrollbar,
  .hover-tags::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }

  .hover-desc::-webkit-scrollbar-track,
  .hover-tags::-webkit-scrollbar-track {
    background: transparent;
  }

  .hover-desc::-webkit-scrollbar-thumb,
  .hover-tags::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  .hover-desc::-webkit-scrollbar-thumb:hover,
  .hover-tags::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
  }

  .hover-tags-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .hover-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    overflow-y: auto;
    max-height: 95px;
    padding-right: 4px;
  }

  .hover-tag {
    font-size: 11px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .hover-tag.highlight-lined {
    background: rgba(59, 130, 246, 0.25);
    color: #93c5fd;
    border-color: rgba(59, 130, 246, 0.4);
    font-weight: 600;
  }

  /* Badges on Image (Desktop & Mobile) */
  .badge-price {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(18, 19, 22, 0.9);
    backdrop-filter: blur(6px);
    color: var(--gold-light);
    font-weight: 700;
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid var(--border-accent);
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }

  .badge-lined {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(30, 58, 138, 0.9);
    backdrop-filter: blur(6px);
    color: #bfdbfe;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid rgba(59, 130, 246, 0.5);
    z-index: 5;
  }

  .badge-fav {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(18, 19, 22, 0.9);
    backdrop-filter: blur(6px);
    color: var(--gold-light);
    font-weight: 700;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .badge-sold {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(185, 28, 28, 0.92);
    color: #fee2e2;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 5;
  }

  .badge-inactive {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(75, 85, 99, 0.92);
    color: #e5e7eb;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 5;
  }

  /* Card Content */
  .card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-title, .thumb-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.45;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .card-title:hover, .thumb-title:hover {
    color: var(--gold);
  }

  .title-desktop {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title-mobile {
    display: none;
  }

  /* Thumb Card */
  .thumb-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .thumb-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
  }

  .thumb-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #0f1013;
  }

  .thumb-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .thumb-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 60px;
    padding: 24px;
    border-top: 1px solid var(--border-color);
  }

  .hidden {
    display: none !important;
  }

  /* ========================================= */
  /* MOBILNA & LANDSCAPE OPTIMIZACIJA          */
  /* ========================================= */
  @media (max-width: 768px), (orientation: landscape) and (max-height: 550px) {
    /* U mobilnoj verziji ne treba opis i tagovi */
    .hover-overlay {
      display: none !important;
    }

    /* Naslov: vidi se samo deo do dimenzije */
    .title-desktop {
      display: none !important;
    }
    .title-mobile {
      display: -webkit-box !important;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px !important;
      line-height: 1.35 !important;
      font-weight: 600 !important;
      color: var(--text-primary);
    }

    /* Skalirani bedževi preko slike */
    .badge-price {
      top: 6px !important;
      right: 6px !important;
      font-size: 11px !important;
      padding: 3px 7px !important;
      border-radius: 12px !important;
    }
    .badge-lined, .badge-sold, .badge-inactive {
      top: 6px !important;
      left: 6px !important;
      font-size: 9px !important;
      padding: 2px 6px !important;
      border-radius: 8px !important;
    }
    .badge-fav {
      bottom: 6px !important;
      right: 6px !important;
      font-size: 10px !important;
      padding: 2px 6px !important;
      border-radius: 8px !important;
    }

    .card-body, .thumb-body {
      padding: 8px 10px !important;
    }

    /* Header i navigacija */
    .header {
      padding: 10px 14px !important;
    }
    .header-inner {
      gap: 8px !important;
    }
    .brand h1 {
      font-size: 20px !important;
    }
    .search-box {
      width: 100% !important;
    }
    .nav-pills {
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .nav-pill {
      padding: 6px 12px !important;
      font-size: 12px !important;
    }

    /* Filter kontrole na telefonu */
    .filter-controls {
      padding: 8px 10px !important;
      gap: 6px !important;
      margin-bottom: 16px !important;
    }
    .filter-group {
      overflow-x: auto;
      white-space: nowrap;
      max-width: 100%;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      padding: 5px 10px !important;
      font-size: 12px !important;
    }
    .filter-divider {
      display: none !important;
    }

    .container {
      margin: 16px auto !important;
      padding: 0 12px !important;
    }
    .section-header {
      margin-bottom: 12px !important;
      padding-bottom: 6px !important;
      gap: 6px !important;
    }
    .section-title {
      font-size: 17px !important;
    }
    .section-count {
      font-size: 11px !important;
      padding: 2px 8px !important;
    }
  }

  /* 2 proizvoda u redu za vertikalni mobilni prikaz (Portrait) */
  @media (max-width: 768px) and (orientation: portrait), (max-width: 540px) {
    .grid-active,
    .grid-thumbs {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 12px !important;
    }
  }

  /* 3 proizvoda u redu za horizontalni mobilni prikaz (Landscape telefon) */
  @media (orientation: landscape) and (max-height: 550px), (min-width: 541px) and (max-width: 950px) and (orientation: landscape) {
    .grid-active,
    .grid-thumbs {
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 12px !important;
    }
  }
</style>
</head>
<body>

<!-- Lock Ekran -->
<div id="lockScreen">
  <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
  </svg>
  <div class="lock-title">aLexLibris · Etsy Katalog</div>
  <div class="lock-subtitle">Unesite lozinku za pristup katalogu proizvoda</div>

  <form class="pwd-form" id="pwdForm" onsubmit="event.preventDefault(); submitPassword();">
    <div class="pwd-input-wrapper">
      <input type="password" id="passwordInput" class="pwd-box" placeholder="Lozinka..." autocomplete="current-password" autofocus>
      <button type="button" class="pwd-toggle-btn" id="togglePwd" title="Prikaži ili sakrij lozinku">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <button type="submit" class="unlock-btn">Otključaj Katalog</button>
    <div class="pwd-error" id="lockError"></div>
  </form>
</div>

<!-- Dekriptovani Sadržaj Kataloga -->
<div id="catalogContent"></div>

<script>
  // WebCrypto AES-GCM Dekripcija
  async function decryptWithPin(pin, payload) {
    const enc = new TextEncoder();
    const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
    const ciphertext = Uint8Array.from(atob(payload.ciphertext), c => c.charCodeAt(0));

    const keyMaterial = await window.crypto.subtle.importKey(
      "raw",
      enc.encode(pin),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );

    const key = await window.crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const decrypted = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      ciphertext
    );

    return new TextDecoder().decode(decrypted);
  }

  const pwdInput = document.getElementById("passwordInput");
  const pwdToggle = document.getElementById("togglePwd");

  if (pwdToggle && pwdInput) {
    pwdToggle.addEventListener("click", () => {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
      } else {
        pwdInput.type = "password";
      }
    });
  }

  async function attemptUnlock(secret) {
    const payloadEl = document.getElementById("encryptedPayload");
    if (!payloadEl) return;
    try {
      const payload = JSON.parse(payloadEl.textContent.trim());
      const decryptedHtml = await decryptWithPin(secret, payload);
      
      // Sačuvaj lozinku u localStorage ako već nije tu
      localStorage.setItem("startpage_secret", secret);
      
      const contentEl = document.getElementById("catalogContent");
      contentEl.innerHTML = decryptedHtml;
      
      document.getElementById("lockScreen").style.display = "none";
      contentEl.style.display = "block";
      
      initCatalog();
    } catch (err) {
      const formEl = document.getElementById("pwdForm");
      if (formEl) {
        formEl.classList.add("shake");
        const errEl = document.getElementById("lockError");
        if (errEl) errEl.textContent = "Pogrešna lozinka!";
        setTimeout(() => {
          formEl.classList.remove("shake");
        }, 400);
      }
    }
  }

  function submitPassword() {
    if (!pwdInput) return;
    const val = pwdInput.value.trim();
    if (val) {
      attemptUnlock(val);
    }
  }

  // Ako korisnik već ima sačuvanu šifru na računaru ili telefonu, otključaj instant
  const savedSecret = localStorage.getItem("startpage_secret");
  if (savedSecret) {
    attemptUnlock(savedSecret);
  }

  // Inicijalizacija JavaScript filtera i pretrage nakon otključavanja
  function initCatalog() {
    const searchInput = document.getElementById("liveSearch");
    const statusBtns = document.querySelectorAll("#statusTabs .nav-pill");

    const activeSection = document.getElementById("active-section");
    const soldSection = document.getElementById("sold-section");
    const inactiveSection = document.getElementById("inactive-section");

    const activeCards = document.querySelectorAll("#activeGrid .card");
    const soldCards = document.querySelectorAll("#soldGrid .thumb-card");
    const inactiveCards = document.querySelectorAll("#inactiveGrid .thumb-card");

    const activeCountBadge = document.getElementById("activeCountBadge");
    const soldCountBadge = document.getElementById("soldCountBadge");
    const inactiveCountBadge = document.getElementById("inactiveCountBadge");

    const catBtns = document.querySelectorAll("#categoryFilters .filter-btn");
    const paperBtns = document.querySelectorAll("#paperFilters .filter-btn");
    const noResultsEl = document.getElementById("noResults");

    let currentStatus = "active";
    let selectedCategory = "all";
    let selectedPaper = "all";

    function applyFilters() {
      const query = (searchInput.value || "").trim().toLowerCase();

      const showActive = (currentStatus === "active");
      const showSold = (currentStatus === "sold");
      const showInactive = (currentStatus === "inactive");

      let activeVisible = 0;
      let soldVisible = 0;
      let inactiveVisible = 0;

      // 1. Filtriranje aktivnih
      if (showActive) {
        activeCards.forEach(card => {
          const title = card.getAttribute("data-title") || "";
          const tags = card.getAttribute("data-tags") || "";
          const cat = card.getAttribute("data-cat") || "";
          const paper = card.getAttribute("data-paper") || "";

          const matchesSearch = !query || title.includes(query) || tags.includes(query);
          const matchesCat = (selectedCategory === "all") || (cat === selectedCategory);
          const matchesPaper = (selectedPaper === "all") || (paper === selectedPaper);

          if (matchesSearch && matchesCat && matchesPaper) {
            card.classList.remove("hidden");
            activeVisible++;
          } else {
            card.classList.add("hidden");
          }
        });

        activeSection.style.display = (query && activeVisible === 0) ? "none" : "block";
        if (activeCountBadge) activeCountBadge.textContent = activeVisible;
      } else {
        activeSection.style.display = "none";
      }

      // 2. Filtriranje prodatih (Sold Out)
      if (showSold) {
        soldCards.forEach(card => {
          const title = card.getAttribute("data-title") || "";
          const tags = card.getAttribute("data-tags") || "";
          const matchesSearch = !query || title.includes(query) || tags.includes(query);

          if (matchesSearch) {
            card.classList.remove("hidden");
            soldVisible++;
          } else {
            card.classList.add("hidden");
          }
        });

        soldSection.style.display = (query && soldVisible === 0) ? "none" : "block";
        if (soldCountBadge) soldCountBadge.textContent = soldVisible;
      } else {
        soldSection.style.display = "none";
      }

      // 3. Filtriranje neaktivnih (Inactive)
      if (showInactive) {
        inactiveCards.forEach(card => {
          const title = card.getAttribute("data-title") || "";
          const tags = card.getAttribute("data-tags") || "";
          const matchesSearch = !query || title.includes(query) || tags.includes(query);

          if (matchesSearch) {
            card.classList.remove("hidden");
            inactiveVisible++;
          } else {
            card.classList.add("hidden");
          }
        });

        inactiveSection.style.display = (query && inactiveVisible === 0) ? "none" : "block";
        if (inactiveCountBadge) inactiveCountBadge.textContent = inactiveVisible;
      } else {
        inactiveSection.style.display = "none";
      }

      const totalVisible = (showActive ? activeVisible : 0) + (showSold ? soldVisible : 0) + (showInactive ? inactiveVisible : 0);
      if (noResultsEl) {
        if (totalVisible === 0) {
          noResultsEl.classList.remove("hidden");
        } else {
          noResultsEl.classList.add("hidden");
        }
      }
    }

    statusBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        statusBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentStatus = btn.getAttribute("data-status") || "active";

        if (currentStatus === "active") {
          searchInput.placeholder = "Pretraži aktivne proizvode (naslov, tagovi)...";
        } else if (currentStatus === "sold") {
          searchInput.placeholder = "Pretraži prodate proizvode (Sold Out)...";
        } else if (currentStatus === "inactive") {
          searchInput.placeholder = "Pretraži neaktivne proizvode (Inactive)...";
        }

        applyFilters();
      });
    });

    if (searchInput) {
      searchInput.addEventListener("input", applyFilters);
      searchInput.addEventListener("focus", () => {
        const headerEl = document.querySelector(".header");
        if (headerEl) headerEl.classList.remove("header-hidden");
      });
    }

    catBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        catBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCategory = btn.getAttribute("data-cat") || "all";
        applyFilters();
      });
    });

    paperBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        paperBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPaper = btn.getAttribute("data-paper") || "all";
        applyFilters();
      });
    });

    // Skrivanje zaglavlja (brend, status tabovi, search) pri skrolovanju na dole
    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    window.addEventListener("scroll", () => {
      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
      const headerEl = document.querySelector(".header");
      if (!headerEl) return;

      if (currentScrollY <= 20) {
        headerEl.classList.remove("header-hidden");
        lastScrollY = currentScrollY;
        return;
      }

      if (Math.abs(currentScrollY - lastScrollY) < 6) {
        return;
      }

      if (currentScrollY > lastScrollY && currentScrollY > 70) {
        headerEl.classList.add("header-hidden");
      } else if (currentScrollY < lastScrollY) {
        headerEl.classList.remove("header-hidden");
      }

      lastScrollY = currentScrollY;
    }, { passive: true });

    // Inicijalno primeni filtere
    applyFilters();
  }
</script>
